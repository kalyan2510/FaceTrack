<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560" role="img" aria-labelledby="loginArtTitle">
  <title id="loginArtTitle">Face scanning illustration with attendance confirmation</title>
  <defs>
    <linearGradient id="bgBlob" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DBEAFE"/>
      <stop offset="1" stop-color="#EFF6FF"/>
    </linearGradient>
    <linearGradient id="scanLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60A5FA" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#60A5FA" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cardAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#BFDBFE"/>
    </pattern>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#14213D" flood-opacity="0.12"/>
    </filter>
    <filter id="smallShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#14213D" flood-opacity="0.14"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background composition -->
  <circle cx="330" cy="278" r="228" fill="url(#bgBlob)"/>
  <circle cx="118" cy="92" r="44" fill="#DBEAFE" opacity="0.8"/>
  <circle cx="552" cy="438" r="30" fill="#BFDBFE" opacity="0.7"/>
  <rect x="48" y="196" width="150" height="150" rx="30" fill="url(#dots)" opacity="0.9"/>
  <rect x="486" y="52" width="112" height="112" rx="26" fill="url(#dots)" opacity="0.8"/>
  <path d="M74 412c34-26 56-30 92-14" fill="none" stroke="#93C5FD" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 10"/>

  <!-- scanner card -->
  <g filter="url(#softShadow)">
    <rect x="176" y="94" width="312" height="360" rx="32" fill="#FFFFFF"/>
    <rect x="176" y="94" width="312" height="74" rx="32" fill="url(#cardAccent)"/>
    <rect x="176" y="140" width="312" height="28" fill="url(#cardAccent)"/>
    <circle cx="206" cy="126" r="5" fill="#93C5FD"/>
    <circle cx="224" cy="126" r="5" fill="#60A5FA"/>
    <text x="246" y="132" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" letter-spacing="0.4">FaceTrack Scanner</text>
    <rect x="468" y="117" width="9" height="18" rx="4.5" fill="#34D399"/>
  </g>

  <!-- scan viewport -->
  <rect x="216" y="194" width="232" height="196" rx="22" fill="#F8FAFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <g fill="none" stroke="#2563EB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M234 226v-13a9 9 0 0 1 9-9h13"/>
    <path d="M421 226v-13a9 9 0 0 0-9-9h-13"/>
    <path d="M234 358v13a9 9 0 0 0 9 9h13"/>
    <path d="M421 358v13a9 9 0 0 1-9 9h-13"/>
  </g>
  <!-- face outline -->
  <g fill="none" stroke="#14213D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M332 230c23 0 41 18 41 41v13c0 11-4 20-11 27"/>
    <path d="M332 230c-23 0-41 18-41 41v13c0 11 4 20 11 27"/>
    <path d="M302 311c0 20 13 35 30 35s30-15 30-35"/>
    <path d="M318 273h.5M345 273h.5" stroke-width="6"/>
    <path d="M326 306c4 3 8 3 12 0"/>
  </g>
  <!-- scan bar -->
  <rect x="238" y="282" width="188" height="3" rx="1.5" fill="url(#scanLine)" filter="url(#glow)"/>
  <!-- face bounding box hint -->
  <rect x="280" y="220" width="104" height="120" rx="12" fill="none" stroke="#93C5FD" stroke-width="1.5" stroke-dasharray="7 7" opacity="0.8"/>

  <!-- scanner footer -->
  <rect x="216" y="408" width="232" height="10" rx="5" fill="#EDF2FA"/>
  <rect x="216" y="408" width="156" height="10" rx="5" fill="#2563EB"/>
  <text x="216" y="438" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#64748B">Scanning live feed…</text>
  <circle cx="431" cy="434" r="4" fill="#16A34A"/>
  <text x="441" y="438" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#16A34A">Camera on</text>

  <!-- attendance success card -->
  <g filter="url(#smallShadow)">
    <rect x="62" y="250" width="196" height="90" rx="20" fill="#FFFFFF"/>
    <circle cx="94" cy="295" r="19" fill="#DCFCE7"/>
    <path d="M85.5 295.5l6 6 12-13" fill="none" stroke="#16A34A" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="124" y="285" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#14213D">Attendance marked</text>
    <text x="124" y="305" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="11" fill="#64748B">Aarav Sharma · 09:02 AM</text>
    <rect x="124" y="316" width="52" height="14" rx="7" fill="#DCFCE7"/>
    <text x="134" y="326.5" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#15803D">PRESENT</text>
  </g>

  <!-- match score card -->
  <g filter="url(#smallShadow)">
    <rect x="392" y="132" width="186" height="94" rx="20" fill="#FFFFFF"/>
    <circle cx="422" cy="166" r="16" fill="#DBEAFE"/>
    <path d="M414 166l5.4 5.4L429 160" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="448" y="160" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#64748B">Match score</text>
    <text x="448" y="181" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#14213D">96.4%</text>
    <rect x="408" y="198" width="154" height="7" rx="3.5" fill="#E2E8F0"/>
    <rect x="408" y="198" width="126" height="7" rx="3.5" fill="#2563EB"/>
  </g>

  <!-- stat card -->
  <g filter="url(#smallShadow)">
    <rect x="444" y="334" width="152" height="98" rx="20" fill="#FFFFFF"/>
    <rect x="462" y="352" width="34" height="34" rx="10" fill="#DBEAFE"/>
    <path d="M471 369h16M471 374h10" stroke="#2563EB" stroke-width="2.4" stroke-linecap="round"/>
    <text x="506" y="364" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#64748B">Present today</text>
    <text x="506" y="383" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#14213D">128</text>
    <text x="462" y="416" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#16A34A">▲ 4.2% vs yesterday</text>
  </g>

  <!-- small floating check -->
  <g filter="url(#smallShadow)">
    <circle cx="560" cy="254" r="30" fill="#16A34A"/>
    <path d="M547 254l9 9 18-20" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
