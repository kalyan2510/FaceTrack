<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="ftLogoTitle">
  <title id="ftLogoTitle">FaceTrack logo</title>
  <defs>
    <linearGradient id="ftGradient" x1="6" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="0.55" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="ftShine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="62" height="62" rx="17" fill="url(#ftGradient)"/>
  <rect x="1" y="1" width="62" height="62" rx="17" fill="url(#ftShine)"/>

  <!-- scanning corners -->
  <g fill="none" stroke="#BFDBFE" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M15 23v-4.5A3.5 3.5 0 0 1 18.5 15H23"/>
    <path d="M41 15h4.5A3.5 3.5 0 0 1 49 18.5V23"/>
    <path d="M49 41v4.5a3.5 3.5 0 0 1-3.5 3.5H41"/>
    <path d="M23 49h-4.5A3.5 3.5 0 0 1 15 45.5V41"/>
  </g>

  <!-- human face outline -->
  <g fill="none" stroke="#FFFFFF" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="32" cy="28" r="8.4"/>
    <path d="M19.5 48.5c0-6.9 5.6-12.5 12.5-12.5s12.5 5.6 12.5 12.5"/>
  </g>

  <!-- attendance checkmark -->
  <circle cx="47.5" cy="47.5" r="10.5" fill="#16A34A" stroke="#FFFFFF" stroke-width="2.5"/>
  <path d="M42.7 47.7l3.2 3.2 6.2-6.6" fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
